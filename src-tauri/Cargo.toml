[package]
name = "roxys-admin"
version = "1.0.0"
description = "Roxys Admin — local travel-points manager for Roxys Travel Plan"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"

[profile.release]
# Smaller, faster-to-ship installers.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
